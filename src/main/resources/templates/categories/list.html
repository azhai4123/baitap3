<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Categories | Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Library</a>
        <div class="navbar-nav flex-row flex-wrap gap-3">
            <a class="nav-link" th:href="@{/books}">Books</a>
            <a class="nav-link active" th:href="@{/categories}">Categories</a>
            <a class="nav-link" th:href="@{/authors}">Authors</a>
        </div>
    </div>
</nav>
<main class="container py-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h1 class="h2 mb-1">Categories</h1>
            <p class="text-body-secondary mb-0">Manage the book categories in your library.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/categories/new}">Add category</a>
    </div>

    <form class="row g-2 mb-3" method="get" th:action="@{/categories}">
        <div class="col-sm-8 col-md-5">
            <label class="visually-hidden" for="category-search">Search categories</label>
            <input class="form-control" id="category-search" name="q" placeholder="Search categories" th:value="${query}">
        </div>
        <div class="col-auto"><button class="btn btn-outline-secondary" type="submit">Search</button></div>
        <div class="col-auto" th:if="${!#strings.isEmpty(query)}"><a class="btn btn-link" th:href="@{/categories}">Clear</a></div>
    </form>

    <div class="table-responsive bg-white border rounded">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light"><tr><th scope="col">Category</th><th scope="col" class="text-end">Actions</th></tr></thead>
            <tbody>
            <tr th:each="category : ${categories}">
                <td class="fw-medium" th:text="${category.name}"></td>
                <td class="text-end text-nowrap">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/categories/{id}/edit(id=${category.id})}">Edit</a>
                    <form class="d-inline" method="post" th:action="@{/categories/{id}/delete(id=${category.id})}"
                          onsubmit="return confirm('Delete this category? It will be removed from its books.');">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(categories)}"><td class="text-center text-body-secondary py-5" colspan="2">No categories found.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
