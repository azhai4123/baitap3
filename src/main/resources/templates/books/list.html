<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Books | Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Library</a>
        <div class="navbar-nav flex-row flex-wrap gap-3">
            <a class="nav-link active" th:href="@{/books}">Books</a>
            <a class="nav-link" th:href="@{/categories}">Categories</a>
            <a class="nav-link" th:href="@{/authors}">Authors</a>
        </div>
    </div>
</nav>
<main class="container py-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h1 class="h2 mb-1">Books</h1>
            <p class="text-body-secondary mb-0">Manage books, authors, details, and categories.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/books/new}">Add book</a>
    </div>

    <div class="table-responsive bg-white border rounded">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
            <tr><th scope="col">Title</th><th scope="col">Author</th><th scope="col">ISBN</th><th scope="col">Categories</th><th scope="col" class="text-end">Actions</th></tr>
            </thead>
            <tbody>
            <tr th:each="book : ${books}">
                <td class="fw-medium" th:text="${book.title}"></td>
                <td th:text="${book.author.name}"></td>
                <td th:text="${book.isbn}"></td>
                <td>
                    <span th:if="${#sets.isEmpty(book.categories)}" class="text-body-secondary">Uncategorized</span>
                    <span th:each="category, status : ${book.categories}">
                        <span th:text="${category.name}"></span><span th:if="${!status.last}">, </span>
                    </span>
                </td>
                <td class="text-end text-nowrap">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/books/{id}/edit(id=${book.id})}">Edit</a>
                    <form class="d-inline" method="post" th:action="@{/books/{id}/delete(id=${book.id})}"
                          onsubmit="return confirm('Delete this book?');">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(books)}"><td class="text-center text-body-secondary py-5" colspan="5">No books yet. Add an author and category, then create a book.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
