<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${editing} ? 'Edit book | Library' : 'Add book | Library'">Book | Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" th:href="@{/books}">Library</a></div></nav>
<main class="container py-5">
    <div class="mx-auto" style="max-width: 760px">
        <h1 class="h2 mb-4" th:text="${editing} ? 'Edit book' : 'Add book'">Book</h1>
        <form class="bg-white border rounded p-4" method="post"
              th:action="${editing} ? @{/books/{id}(id=${bookId})} : @{/books}"
              th:object="${bookForm}">
            <div class="alert alert-danger" role="alert" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></div>
            <div class="mb-3">
                <label class="form-label" for="title">Title</label>
                <input class="form-control" id="title" required maxlength="200" th:field="*{title}"
                       th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{title}"></div>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-md-7">
                    <label class="form-label" for="authorId">Author</label>
                    <select class="form-select" id="authorId" required th:field="*{authorId}"
                            th:classappend="${#fields.hasErrors('authorId')} ? 'is-invalid'">
                        <option value="">Choose an author</option>
                        <option th:each="author : ${authors}" th:value="${author.id}" th:text="${author.name}"></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{authorId}"></div>
                </div>
                <div class="col-md-5 d-flex align-items-end">
                    <a class="btn btn-outline-secondary" th:href="@{/authors/new}">Add author</a>
                </div>
            </div>
            <div class="row g-3 mb-4">
                <div class="col-md-8">
                    <label class="form-label" for="isbn">ISBN</label>
                    <input class="form-control" id="isbn" required maxlength="32" th:field="*{isbn}"
                           th:classappend="${#fields.hasErrors('isbn')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{isbn}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="pageCount">Pages</label>
                    <input class="form-control" id="pageCount" type="number" min="1" required th:field="*{pageCount}"
                           th:classappend="${#fields.hasErrors('pageCount')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{pageCount}"></div>
                </div>
            </div>
            <fieldset class="mb-4">
                <legend class="form-label fs-6">Categories</legend>
                <div th:if="${#lists.isEmpty(categories)}" class="text-body-secondary">
                    No categories available. <a th:href="@{/categories/new}">Add a category</a>.
                </div>
                <div class="row g-2" th:unless="${#lists.isEmpty(categories)}">
                    <div class="col-sm-6 col-lg-4" th:each="category : ${categories}">
                        <div class="form-check border rounded p-2 ps-5">
                            <input class="form-check-input" type="checkbox" th:field="*{categoryIds}" th:value="${category.id}">
                            <label class="form-check-label" th:for="${#ids.prev('categoryIds')}" th:text="${category.name}"></label>
                        </div>
                    </div>
                </div>
            </fieldset>
            <div class="d-flex gap-2">
                <button class="btn btn-primary" type="submit" th:text="${editing} ? 'Save changes' : 'Create book'">Save</button>
                <a class="btn btn-outline-secondary" th:href="@{/books}">Cancel</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
